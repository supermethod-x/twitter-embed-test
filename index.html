<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Prompt</title>

    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="Prompt">
    <meta name="twitter:description" content="A tiny text prompt, right in the timeline.">
    <meta name="twitter:image" content="https://yoursite.com/preview.png">
    <meta name="twitter:player" content="https://yoursite.com/index.html">
    <meta name="twitter:player:width" content="600">
    <meta name="twitter:player:height" content="300">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yoursite.com/index.html">
    <meta property="og:title" content="Prompt">
    <meta property="og:description" content="A tiny text prompt, right in the timeline.">
    <meta property="og:image" content="https://yoursite.com/preview.png">

    <style>
      :root {
        --bg: #1f2023;
        --panel: #2a2b2f;
        --field: #1a1b1e;
        --line: #3a3c41;
        --line-hover: #4b4e55;
        --text: #e6e7ea;
        --muted: #8b8e96;
        --accent: #8fa6c9;
        --btn: #34363b;
        --btn-hover: #3e4046;
        --btn-active: #2c2d31;
        --ok: #e6e7ea;
        --ok-hover: #ffffff;
        --ok-active: #c9cbd0;
        --ok-text: #1f2023;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        place-items: center;
        padding: 16px;
      }

      .dialog {
        width: 100%;
        max-width: 340px;
        padding: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }

      input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        background: var(--field);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 9px;
        font: inherit;
        outline: none;
        caret-color: var(--accent);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input::placeholder {
        color: #5d6068;
      }

      input:hover {
        border-color: var(--line-hover);
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(143, 166, 201, 0.22);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }

      button {
        height: 36px;
        min-width: 76px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 9px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.08s ease, box-shadow 0.12s ease;
      }

      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(143, 166, 201, 0.35);
      }

      button:active {
        transform: translateY(1px) scale(0.98);
      }

      .cancel {
        background: var(--btn);
        color: var(--text);
        border-color: var(--line);
      }

      .cancel:hover {
        background: var(--btn-hover);
        border-color: var(--line-hover);
      }

      .cancel:active {
        background: var(--btn-active);
      }

      .ok {
        background: var(--ok);
        color: var(--ok-text);
      }

      .ok:hover {
        background: var(--ok-hover);
      }

      .ok:active {
        background: var(--ok-active);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }

        button:active {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="dialog">
      <label for="line">Enter a line of text</label>
      <input id="line" type="text" placeholder="Type here" autocomplete="off" spellcheck="false">
      
      <div class="actions">
        <button type="button" class="cancel">Cancel</button>
        <button type="button" class="ok">OK</button>
      </div>
    </div>
  </body>
</html>
